  <!--
      Generic social metadata for the app shell.

      This is the fallback for home and other non-listing pages, and it also gives
      iOS Messages/SMS a proper rich preview when a shared Jobblo URL is opened.
      None of these crawlers executes JavaScript, so the tags must be present in the
      server-rendered HTML and not only in the client app shell.
    -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Jobblo" />
  <meta property="og:title" content="Jobblo – Finn eller legg ut oppdrag" />
  <meta property="og:description"
    content="Jobblo kobler deg med folk som kan gjøre jobben. Legg ut oppdraget ditt gratis, få tilbud, og betal trygt med SafePay." />
  <meta property="og:url" content="https://jobblo.no" />
  <meta property="og:image" content="https://jobblo.no/assets/share-image.png" />
  <meta property="og:image:secure_url" content="https://jobblo.no/assets/share-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="nb_NO" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Jobblo – Finn eller legg ut oppdrag" />
  <meta name="twitter:description"
    content="Jobblo kobler deg med folk som kan gjøre jobben. Legg ut oppdraget ditt gratis, få tilbud, og betal trygt med SafePay." />
