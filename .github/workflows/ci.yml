name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Disabled: deployments are handled manually through deploy.sh on Linode.
permissions:
  contents: read

jobs:
  call-build-and-push-backend:
    if: ${{ false }}
    uses: ./.github/workflows/build_and_push_backend.yml
    secrets: inherit
