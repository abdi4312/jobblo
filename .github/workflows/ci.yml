name: CI

# One workflow for all app checks. Each job only runs when its own area changes
# (path filters) and they run in parallel. No Docker, no standalone type-check step.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Detect backend changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.backend == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.backend == 'true'
        run: |
          npm ci
          echo '### Backend install: passed' >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        if: steps.changes.outputs.backend == 'true'
        run: |
          npm run test:ci
          echo '### Backend tests: passed' >> "$GITHUB_STEP_SUMMARY"

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: npm ci

      # Lint stays non-blocking while the frontend backlog is worked through;
      # the production build is the blocking correctness check.
      - name: Lint (non-blocking)
        if: steps.changes.outputs.frontend == 'true'
        continue-on-error: true
        run: |
          set +e
          npm run lint > lint.log 2>&1
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            echo "### Frontend lint: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Frontend lint: existing issues (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -50 lint.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$STATUS"

      - name: Build
        if: steps.changes.outputs.frontend == 'true'
        env:
          VITE_MAIN_URL: https://example.invalid
          VITE_GOOGLE_MAPS_API_KEY: ci-build-placeholder
        run: |
          npm run build
          echo '### Frontend build: passed' >> "$GITHUB_STEP_SUMMARY"

  # ── Mobile ─────────────────────────────────────────────────────────────────
  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jobblo-app
    steps:
      - uses: actions/checkout@v4

      - name: Detect mobile changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            mobile:
              - 'jobblo-app/**'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.mobile == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: jobblo-app/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.mobile == 'true'
        run: |
          npm ci
          echo '### Mobile install: passed' >> "$GITHUB_STEP_SUMMARY"

      - name: Expo config
        if: steps.changes.outputs.mobile == 'true'
        run: |
          npx --no-install expo config --type public > /dev/null
          echo '### Mobile Expo config: passed' >> "$GITHUB_STEP_SUMMARY"
