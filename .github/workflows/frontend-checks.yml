name: Frontend checks

# Typecheck and lint remain non-blocking while the existing frontend backlog is
# addressed. The production build is the blocking correctness check.

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-checks.yml"
  workflow_dispatch:

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (non-blocking)
        continue-on-error: true
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          STATUS=$?
          COUNT=$(grep -c "error TS" typecheck.log || true)
          echo "### TypeScript: ${COUNT} errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -50 typecheck.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      - name: Lint (non-blocking)
        continue-on-error: true
        run: |
          set +e
          npm run lint > lint.log 2>&1
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            echo "### Lint: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Lint: existing issues (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -50 lint.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$STATUS"

      - name: Build frontend
        env:
          VITE_MAIN_URL: https://example.invalid
          VITE_GOOGLE_MAPS_API_KEY: ci-build-placeholder
        run: npm run build
