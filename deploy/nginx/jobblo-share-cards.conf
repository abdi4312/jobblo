# ============================================================================
#  Jobblo — social share cards (Open Graph) via crawler routing
# ============================================================================
#
#  STATUS: NOT APPLIED. This file is documentation, not live configuration.
#
#  Production nginx does not live in this repository. `deploy.sh` ends with
#  `sudo systemctl restart nginx`, so the real server block is on the VM, in
#  /etc/nginx/sites-available/. Nothing in this repo can change it, and this
#  file has no effect until a human copies the pieces below into that server
#  block and reloads nginx. See "HOW TO APPLY" at the bottom.
#
#  ---------------------------------------------------------------------------
#  WHY THIS IS NEEDED
#  ---------------------------------------------------------------------------
#  Facebook, WhatsApp, iMessage, Slack, LinkedIn, Discord, Telegram and X all
#  fetch a URL exactly once, read the <head>, and never execute JavaScript.
#  Today every one of them receives the React shell — index.html — and there is
#  no listing data in it, so a pasted job link previews as a bare URL.
#
#  The backend already renders correct Open Graph HTML at
#  GET /job-listing/:id (backend/routes/preview.js), but that route only exists
#  on the API host. Nothing routes crawler traffic to it. This map closes that
#  gap: crawlers go to the preview renderer, humans go to the SPA, at the same
#  public URL.
#
#  ---------------------------------------------------------------------------
#  PIECE 1 — crawler detection.  Goes at http{} level, OUTSIDE server{}.
#  ---------------------------------------------------------------------------
#  Put this in /etc/nginx/conf.d/jobblo-crawlers.conf, or at the top of
#  nginx.conf inside http{}. A `map` is evaluated lazily and compiled once,
#  which is why it is used here rather than a chain of `if` blocks — `if`
#  inside a location is famously order-dependent in ways that break try_files.
#
#  Case-insensitive (~*) because these strings are not stably cased in the
#  wild: WhatsApp sends "WhatsApp/2.x", older builds sent "whatsapp".

map $http_user_agent $jobblo_is_crawler {
    default                 0;

    # Meta / Facebook — Messenger and the Facebook app both use these.
    "~*facebookexternalhit"  1;
    "~*Facebot"              1;
    "~*facebookcatalog"      1;

    # WhatsApp link previews.
    "~*WhatsApp"             1;

    # X / Twitter.
    "~*Twitterbot"           1;

    # Slack unfurling (Slackbot-LinkExpanding).
    "~*Slackbot"             1;

    # LinkedIn post previews.
    "~*LinkedInBot"          1;

    # Discord embeds.
    "~*Discordbot"           1;

    # Telegram link previews.
    "~*TelegramBot"          1;

    # Apple — iMessage rich links and Spotlight.
    "~*Applebot"             1;

    # Signal, Pinterest, Reddit, Skype, Viber, Nextdoor — same one-shot
    # fetch-and-parse behaviour. Harmless to include; they get better cards.
    "~*Signal"               1;
    "~*Pinterest"            1;
    "~*redditbot"            1;
    "~*SkypeUriPreview"      1;
    "~*Viber"                1;
    "~*vkShare"              1;
    "~*W3C_Validator"        1;
    "~*Iframely"             1;
    "~*Embedly"              1;
}

#  ---------------------------------------------------------------------------
#  PIECE 2 — the location block.  Goes INSIDE the existing server{} for
#  jobblo.no, ABOVE the catch-all `location / { try_files ... /index.html; }`.
#  ---------------------------------------------------------------------------
#
#  Replace 127.0.0.1:5000 with whatever port pm2 runs `jobblo-api` on.

# server {
#     server_name jobblo.no www.jobblo.no;
#     root /var/www/jobblo/frontend/dist;
#
#     # ---- share cards -----------------------------------------------------
#     # Regex location, so it is matched before the prefix `location /` below
#     # regardless of where it appears in the file.
#     location ~ ^/job-listing/([^/]+)/?$ {
#
#         # A human asking for this URL must get the app, not the preview HTML.
#         # This is the single most important line in the file: getting it
#         # backwards serves a bare <h1> to every real visitor.
#         if ($jobblo_is_crawler = 0) {
#             rewrite ^ /index.html last;
#         }
#
#         proxy_pass http://127.0.0.1:5000$request_uri;
#
#         # $request_uri preserves the path AND the query string exactly as
#         # received, so /job-listing/abc?utm_source=fb reaches the backend
#         # intact. Do NOT write `proxy_pass http://127.0.0.1:5000;` with a
#         # trailing slash — that rewrites the path and the route 404s.
#
#         proxy_http_version 1.1;
#         proxy_set_header Host              $host;
#         proxy_set_header X-Real-IP         $remote_addr;
#         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_set_header X-Forwarded-Host  $host;
#
#         # Pass the crawler's own UA through. The backend sets `Vary:
#         # User-Agent`, and any cache in front of nginx must see the header it
#         # is told to vary on or it will serve crawler HTML to a browser.
#         proxy_set_header User-Agent        $http_user_agent;
#
#         # Crawlers give up quickly; failing fast beats hanging.
#         proxy_connect_timeout 3s;
#         proxy_read_timeout    5s;
#
#         # If the backend is down, fall back to the SPA shell rather than
#         # showing the crawler a 502 — a cached 502 suppresses the card long
#         # after the outage ends.
#         proxy_intercept_errors on;
#         error_page 500 502 503 504 = /index.html;
#     }
#
#     # ---- API -------------------------------------------------------------
#     location /api/ {
#         proxy_pass http://127.0.0.1:5000;
#         proxy_http_version 1.1;
#         proxy_set_header Host              $host;
#         proxy_set_header X-Real-IP         $remote_addr;
#         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_set_header Upgrade           $http_upgrade;
#         proxy_set_header Connection        "upgrade";
#     }
#
#     # ---- SPA -------------------------------------------------------------
#     location / {
#         try_files $uri $uri/ /index.html;
#     }
# }
#
#  ---------------------------------------------------------------------------
#  REDIRECT LOOPS — why there is none here
#  ---------------------------------------------------------------------------
#  `rewrite ^ /index.html last` re-enters location matching once and lands in
#  `location /`, which serves a file. It does not re-enter the regex location,
#  because /index.html does not match ^/job-listing/.
#
#  The backend must not redirect either. The old preview route emitted
#  `<script>location.replace(...)</script>`; that has been removed. If a future
#  version answers 301/302 to the SPA URL, a crawler that follows it lands back
#  on nginx, is still detected as a crawler, and proxies to the backend again —
#  a loop. Keep the preview route answering 200.
#
#  ---------------------------------------------------------------------------
#  ENVIRONMENT
#  ---------------------------------------------------------------------------
#  Backend (.env, then `pm2 restart jobblo-api --update-env`):
#
#      PUBLIC_SITE_URL=https://jobblo.no
#          Canonical origin for og:url. Without it the route falls back to
#          FRONTEND_URL. It must be the PUBLIC site, never the API host.
#
#      SOCIAL_SHARE_IMAGE=https://jobblo.no/og-default.png     (optional)
#          Fallback card for listings with no photo. Leave UNSET until the
#          asset actually exists — the code omits og:image when it is unset,
#          which renders a clean text card, and points at a broken image if it
#          is set to something missing.
#
#  Frontend (build-time):
#
#      VITE_PUBLIC_SITE_URL=https://jobblo.no
#          Makes "Del annonse" share the canonical URL rather than whatever
#          host the SPA was loaded from.
#
#  ---------------------------------------------------------------------------
#  HOW TO APPLY  (DevOps, on the VM — not done by this change)
#  ---------------------------------------------------------------------------
#    1. sudo cp this file's PIECE 1 into /etc/nginx/conf.d/jobblo-crawlers.conf
#    2. Paste PIECE 2's `location ~ ^/job-listing/...` block into the existing
#       jobblo.no server block, above `location / {`.
#    3. Set PUBLIC_SITE_URL in backend/.env; pm2 restart jobblo-api --update-env
#    4. sudo nginx -t          # must pass before reloading
#    5. sudo systemctl reload nginx      # reload, not restart — no dropped conns
#    6. Verify with the curl commands in the Stage B1 share-cards report.
#    7. Re-scrape existing links:
#         Facebook  https://developers.facebook.com/tools/debug/
#         LinkedIn  https://www.linkedin.com/post-inspector/
#       Both cache aggressively; without a re-scrape, links shared before this
#       change keep showing the old bare preview.
# ============================================================================
