# Jobblo share cards — route listing URLs to the backend Open Graph renderer for
# social crawlers, and to the SPA for real people.
#
# WHY THREE PATHS: a link gets shared three ways, and all must produce the card:
#   /share/job/:id     — the Share button's URL (backend redirects humans to /jobs/:id)
#   /jobs/:id          — the canonical listing URL
#   /job-listing/:id   — what a user copies from the browser address bar on a listing
# Previously only /share/job/ reached the backend, so a pasted /job-listing/ or /jobs/
# link fell through to the SPA (a JS shell) and every crawler showed the generic
# "Jobblo" card with no image. See backend/routes/preview.js — it already handles all
# three paths.
#
# HOW: a User-Agent map picks the backend only for known crawlers. Humans on /jobs/ and
# /job-listing/ still get the SPA. /share/job/ always goes to the backend (it does its
# own human redirect), so it is not UA-gated.
#
# Paste inside the jobblo.no server{} block, above `location / {`. The `map` goes at
# http{} scope (outside server{}). Fix the port if jobblo-api is not on 5001.

# --- http{} scope ---
map $http_user_agent $jobblo_is_crawler {
    default 0;
    "~*facebookexternalhit|facebot|twitterbot|slackbot|linkedinbot|discordbot|telegrambot|whatsapp|applebot|googlebot|bingbot|duckduckbot|skypeuripreview|viber|embedly|iframely|pinterest|signal" 1;
}

# --- server{} scope ---

# The Share button's URL: always the backend renderer (it 302s humans to /jobs/:id).
location ^~ /share/job/ {
    proxy_pass http://127.0.0.1:5001$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header User-Agent        $http_user_agent;

    proxy_connect_timeout 3s;
    proxy_read_timeout    5s;

    proxy_intercept_errors on;
    error_page 500 502 503 504 = /index.html;
}

# Canonical + address-bar listing URLs: crawlers get the card, humans get the SPA.
# `if` inside location is unreliable with proxy_pass/try_files, so branch by jumping to
# a named location via error_page instead (the standard nginx idiom).
location ~ ^/(jobs|job-listing)/[0-9a-fA-F]{24}/?$ {
    error_page 418 = @jobblo_card;
    if ($jobblo_is_crawler) {
        return 418;
    }
    # Humans (and anything unmatched) get the SPA shell.
    try_files $uri /index.html;
}

# Crawler-only backend render, reached via the 418 jump above.
location @jobblo_card {
    proxy_pass http://127.0.0.1:5001$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header User-Agent        $http_user_agent;

    proxy_connect_timeout 3s;
    proxy_read_timeout    5s;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = /index.html;
}
