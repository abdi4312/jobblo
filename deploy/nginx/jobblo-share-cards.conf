# Jobblo share cards — route /share/job/:id to the backend Open Graph renderer.
# Paste inside the jobblo.no server{} block, above `location / {`.
# The backend (preview.js) redirects real visitors to the SPA, so no UA check
# is needed here. Fix the port if jobblo-api does not run on 5001.

location ^~ /share/job/ {
    proxy_pass http://127.0.0.1:5001$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header User-Agent        $http_user_agent;

    proxy_connect_timeout 3s;
    proxy_read_timeout    5s;

    proxy_intercept_errors on;
    error_page 500 502 503 504 = /index.html;
}
